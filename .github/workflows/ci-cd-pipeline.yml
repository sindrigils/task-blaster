name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dotnet-restore-and-build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0'
      
      - name: Restore Dependencies
        run: dotnet restore
        working-directory: TaskBlaster.TaskManagement

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: TaskBlaster.TaskManagement

  nextjs-build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./taskblaster-web
        run: npm install

      - name: Lint Code
        working-directory: ./taskblaster-web
        run: npm run lint

      - name: Build Next.js App
        run: npm run build
        working-directory: taskblaster-web
